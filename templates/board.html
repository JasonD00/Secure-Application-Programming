    https://flask.palletsprojects.com/en/stable/tutorial/blog/
    https://jinja.palletsprojects.com/en/stable/templates/ -->

{% extends "base.html" %}
{% block content %}
<h1>Notes Board</h1>

{% for post in posts %}
<div class="post">
  <div>{{ post.content }}</div>
  <small>by {{ post.username }} &middot; {{ post.created_at }}</small>
</div>
{% else %}
<p>No notes yet.</p>
{% endfor %}
{% endblock %}

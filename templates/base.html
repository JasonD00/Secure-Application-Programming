      https://flask.palletsprojects.com/en/stable/tutorial/static/ 
      https://flask.palletsprojects.com/en/stable/patterns/flashing/

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Notes Board</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    </head>
    <body>
        <nav>
            <a href="{{ url_for('board') }}">Board</a>
            <a href="{{ url_for('register') }}">Register</a>
        </nav>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ caetgory }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </body>
</html>
